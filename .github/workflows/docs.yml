name: Docs

on:
  push:
    branches: [main]
    tags:
      - '*.*.*'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Pull requests (and manual runs) verify the docs build only -- nothing is
  # published. The rendered site is uploaded so a reviewer can download it.
  build:
    name: Build (verify only)
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    # mortie is a compiled Rust extension, so the package has to be built before
    # mkdocstrings can introspect it. `uv sync` installs the project itself,
    # which drives the maturin build backend and pulls maturin in as a PEP 517
    # build requirement -- so all this job supplies is a toolchain on PATH.
    # There is deliberately no separate maturin step.
    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable

    - name: Install uv
      uses: astral-sh/setup-uv@v6

    - name: Set up Python
      run: uv python install 3.12

    - name: Install dependencies
      run: uv sync --group docs

    - name: Build docs
      run: uv run mkdocs build --strict

    - name: Upload built site
      uses: actions/upload-artifact@v4
      with:
        name: docs-site
        path: site/

  # Pushes publish with mike, which commits the rendered site to the `gh-pages`
  # branch -- hence `contents: write`, rather than the `pages: write` /
  # `id-token: write` an upload-pages-artifact deploy would need. Pages must be
  # configured to serve the `gh-pages` branch, NOT "GitHub Actions".
  deploy:
    name: Deploy (mike)
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Serialize deploys -- concurrent `mike deploy --push` runs would race on
    # the gh-pages branch. Never cancel one mid-push.
    concurrency:
      group: docs-deploy
      cancel-in-progress: false

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # mike needs the gh-pages branch, not just this ref

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable

    - name: Install uv
      uses: astral-sh/setup-uv@v6

    - name: Set up Python
      run: uv python install 3.12

    - name: Install dependencies
      run: uv sync --group docs

    - name: Configure git identity for mike
      run: |
        git config user.name 'github-actions[bot]'
        git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

    - name: Deploy dev docs
      if: github.ref == 'refs/heads/main'
      run: uv run mike deploy --push dev

    # A *.*.* tag is cut by a human as part of a release (the same tag drives
    # the PyPI publish in build-wheels.yml). This job only ever *reacts* to a
    # tag -- it never creates or pushes one.
    - name: Deploy release docs
      if: startsWith(github.ref, 'refs/tags/')
      run: |
        # uv run mike deploy --push --update-aliases "$GITHUB_REF_NAME" latest
        uv run mike deploy --push --update-aliases --alias-type redirect "$GITHUB_REF_NAME" latest
        uv run mike set-default --push latest
